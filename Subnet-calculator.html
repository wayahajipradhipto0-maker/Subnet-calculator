<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Calculator — Jarfis AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0a0a0f, #1a0a2e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 20, 32, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 60px rgba(255, 0, 255, 0.05);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #ff00ff, #00ff41);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            text-align: center;
            color: #8a8aaa;
            font-size: 13px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #b7d0e6;
            margin-bottom: 5px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #e0e0e0;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.1);
        }
        .form-group select option {
            background: #1a1a2e;
            color: #e0e0e0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px 25px;
            background: linear-gradient(135deg, #ff00ff, #cc00cc);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
            min-width: 140px;
        }
        .btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.2);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            box-shadow: none;
        }

        /* Result */
        .result {
            margin-top: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
        }
        .result.show {
            display: block;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
        }
        .result-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 12px 16px;
            border-left: 3px solid #ff00ff;
        }
        .result-item .label {
            font-size: 11px;
            color: #8a8aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .result-item .value {
            font-size: 16px;
            font-weight: 700;
            color: #00ff41;
            margin-top: 4px;
            word-break: break-all;
        }
        .result-item .value.pink {
            color: #ff00ff;
        }
        .result-item .value.yellow {
            color: #f9c74f;
        }
        .result-item .value.blue {
            color: #00d4ff;
        }

        .total-users {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.1), rgba(0, 255, 65, 0.05));
            border: 1px solid rgba(255, 0, 255, 0.2);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
        }
        .total-users .label {
            font-size: 13px;
            color: #b7d0e6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .total-users .value {
            font-size: 42px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff00ff, #00ff41);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 6px;
        }
        .total-users .sub {
            font-size: 12px;
            color: #8a8aaa;
            margin-top: 4px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            color: #4a4a6a;
            font-size: 12px;
        }

        /* Light Mode */
        body.light {
            background: #f0f2f5;
            color: #1a1a2e;
        }
        body.light .container {
            background: #ffffff;
            border: 1px solid #e8e8e8;
        }
        body.light .form-group input,
        body.light .form-group select {
            background: #f5f5f5;
            color: #1a1a2e;
            border: 1px solid #ddd;
        }
        body.light .result {
            background: #f9f9f9;
        }
        body.light .result-item {
            background: #ffffff;
        }
        body.light .result-item .value {
            color: #00cc33;
        }
        body.light .result-item .value.pink {
            color: #cc00cc;
        }
        body.light .total-users {
            background: rgba(255, 0, 255, 0.05);
            border-color: #ff00ff30;
        }
        body.light .total-users .value {
            background: linear-gradient(135deg, #cc00cc, #00cc33);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            h1 {
                font-size: 22px;
            }
            .result-grid {
                grid-template-columns: 1fr;
            }
            .total-users .value {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔢 Subnet Calculator</h1>
    <p class="subtitle">Hitung Subnet Mask, Slashed Decimal, & Total User</p>

    <div class="form-group">
        <label>IP Address</label>
        <input type="text" id="ipInput" placeholder="Contoh: 192.168.1.1" value="192.168.1.1">
    </div>

    <div class="form-group">
        <label>CIDR / Prefix (Slash)</label>
        <select id="cidrSelect">
            <option value="8">/8 — 255.0.0.0</option>
            <option value="9">/9 — 255.128.0.0</option>
            <option value="10">/10 — 255.192.0.0</option>
            <option value="11">/11 — 255.224.0.0</option>
            <option value="12">/12 — 255.240.0.0</option>
            <option value="13">/13 — 255.248.0.0</option>
            <option value="14">/14 — 255.252.0.0</option>
            <option value="15">/15 — 255.254.0.0</option>
            <option value="16">/16 — 255.255.0.0</option>
            <option value="17">/17 — 255.255.128.0</option>
            <option value="18">/18 — 255.255.192.0</option>
            <option value="19">/19 — 255.255.224.0</option>
            <option value="20">/20 — 255.255.240.0</option>
            <option value="21">/21 — 255.255.248.0</option>
            <option value="22">/22 — 255.255.252.0</option>
            <option value="23">/23 — 255.255.254.0</option>
            <option value="24" selected>/24 — 255.255.255.0</option>
            <option value="25">/25 — 255.255.255.128</option>
            <option value="26">/26 — 255.255.255.192</option>
            <option value="27">/27 — 255.255.255.224</option>
            <option value="28">/28 — 255.255.255.240</option>
            <option value="29">/29 — 255.255.255.248</option>
            <option value="30">/30 — 255.255.255.252</option>
            <option value="31">/31 — 255.255.255.254</option>
            <option value="32">/32 — 255.255.255.255</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn" onclick="calculate()">🚀 Hitung Subnet</button>
        <button class="btn btn-secondary" onclick="resetForm()">🔄 Reset</button>
    </div>

    <div class="result" id="result">
        <div class="result-grid" id="resultGrid"></div>
    </div>

    <div class="footer">
        🔥 Subnet Calculator — Created by Jarfis AI
    </div>
</div>

<script>
    // ============================================================
    // SUBNET CALCULATOR
    // ============================================================

    function ipToNumber(ip) {
        const parts = ip.split('.').map(Number);
        return (parts[0] << 24) + (parts[1] << 16) + (parts[2] << 8) + parts[3];
    }

    function numberToIp(num) {
        return [
            (num >>> 24) & 255,
            (num >>> 16) & 255,
            (num >>> 8) & 255,
            num & 255
        ].join('.');
    }

    function cidrToMask(cidr) {
        const mask = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
        return numberToIp(mask);
    }

    function getSubnetClass(ip) {
        const first = parseInt(ip.split('.')[0]);
        if (first >= 1 && first <= 126) return 'A';
        if (first >= 128 && first <= 191) return 'B';
        if (first >= 192 && first <= 223) return 'C';
        if (first >= 224 && first <= 239) return 'D (Multicast)';
        if (first >= 240 && first <= 255) return 'E (Experimental)';
        return 'Unknown';
    }

    function calculate() {
        const ip = document.getElementById('ipInput').value.trim();
        const cidr = parseInt(document.getElementById('cidrSelect').value);

        // Validasi IP
        const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
        if (!ipRegex.test(ip)) {
            alert('❌ Format IP tidak valid! Contoh: 192.168.1.1');
            return;
        }

        const parts = ip.split('.').map(Number);
        for (let p of parts) {
            if (p < 0 || p > 255) {
                alert('❌ Setiap oktet harus 0-255!');
                return;
            }
        }

        const ipNum = ipToNumber(ip);
        const maskNum = cidr === 0 ? 0 : (0xFFFFFFFF << (32 - cidr)) >>> 0;
        const networkNum = (ipNum & maskNum) >>> 0;
        const broadcastNum = (networkNum | (~maskNum >>> 0)) >>> 0;

        const mask = cidrToMask(cidr);
        const network = numberToIp(networkNum);
        const broadcast = numberToIp(broadcastNum);

        // Total host
        const totalHosts = Math.pow(2, 32 - cidr);

        // Usable hosts
        let usableHosts;
        if (cidr === 32) usableHosts = 1;
        else if (cidr === 31) usableHosts = 2;
        else if (cidr === 0) usableHosts = 4294967294;
        else usableHosts = totalHosts - 2;

        // Range host
        let firstHost, lastHost;
        if (cidr === 32) {
            firstHost = ip;
            lastHost = ip;
        } else if (cidr === 31) {
            firstHost = network;
            lastHost = broadcast;
        } else if (cidr === 0) {
            firstHost = '0.0.0.1';
            lastHost = '255.255.255.254';
        } else {
            firstHost = numberToIp(networkNum + 1);
            lastHost = numberToIp(broadcastNum - 1);
        }

        // Wildcard mask
        const wildcardNum = (~maskNum) >>> 0;
        const wildcard = numberToIp(wildcardNum);

        // Subnet class
        const subnetClass = getSubnetClass(ip);

        // Tampilkan hasil
        const grid = document.getElementById('resultGrid');
        grid.innerHTML = `
                <div class="total-users">
                    <div class="label">👥 Total Pengguna / Host</div>
                    <div class="value">${usableHosts.toLocaleString('id-ID')}</div>
                    <div class="sub">Total IP: ${totalHosts.toLocaleString('id-ID')} | Usable: ${usableHosts.toLocaleString('id-ID')}</div>
                </div>

                <div class="result-item">
                    <div class="label">🌐 IP Address</div>
                    <div class="value blue">${ip}</div>
                </div>

                <div class="result-item">
                    <div class="label">📡 Subnet Mask</div>
                    <div class="value pink">${mask}</div>
                </div>

                <div class="result-item">
                    <div class="label">🔢 CIDR / Slash</div>
                    <div class="value yellow">/${cidr}</div>
                </div>

                <div class="result-item">
                    <div class="label">🏠 Network Address</div>
                    <div class="value">${network}</div>
                </div>

                <div class="result-item">
                    <div class="label">📢 Broadcast Address</div>
                    <div class="value">${broadcast}</div>
                </div>

                <div class="result-item">
                    <div class="label">📌 First Host</div>
                    <div class="value">${firstHost}</div>
                </div>

                <div class="result-item">
                    <div class="label">📌 Last Host</div>
                    <div class="value">${lastHost}</div>
                </div>

                <div class="result-item">
                    <div class="label">🔄 Wildcard Mask</div>
                    <div class="value">${wildcard}</div>
                </div>

                <div class="result-item">
                    <div class="label">🏷️ Subnet Class</div>
                    <div class="value">${subnetClass}</div>
                </div>
            `;

        document.getElementById('result').classList.add('show');
    }

    function resetForm() {
        document.getElementById('ipInput').value = '192.168.1.1';
        document.getElementById('cidrSelect').value = '24';
        document.getElementById('result').classList.remove('show');
    }

    // Auto calculate on load
    window.addEventListener('load', calculate);
</script>

</body>
  </html>
